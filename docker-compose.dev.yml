# Postgres de desarrollo. Puerto 5433 para no chocar con un Postgres local en 5432.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: apuflow
      POSTGRES_PASSWORD: apuflow
      POSTGRES_DB: apuflow
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/crear-bd-pruebas.sql:/docker-entrypoint-initdb.d/crear-bd-pruebas.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U apuflow']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
