# Despliegue ligero detrás del nginx del servidor: usa el Postgres del host y escucha solo para nginx.
# Un directorio (y un .env) por cliente: PUERTO, BD_NOMBRE y BD_USUARIO distintos en cada uno.
services:
  apuflow:
    image: apuflow:${VERSION:-demo}
    restart: unless-stopped
    network_mode: host
    # Tope por instancia: si una se pasa, se reinicia sola sin tumbar las demás del VPS.
    mem_limit: ${LIMITE_MEMORIA:-300m}
    environment:
      PORT: ${PUERTO:-3200}
      DATABASE_URL: postgres://${BD_USUARIO:-apuflow}:${BD_CLAVE}@127.0.0.1:5432/${BD_NOMBRE:-apuflow}
      LICENCIA_OBLIGATORIA: ${LICENCIA_OBLIGATORIA:-0}
