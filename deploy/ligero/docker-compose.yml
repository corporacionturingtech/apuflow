# Despliegue ligero detrás del nginx del servidor: usa el Postgres del host y escucha solo para nginx.
services:
  apuflow:
    image: apuflow:${VERSION:-demo}
    restart: unless-stopped
    network_mode: host
    mem_limit: 300m
    environment:
      PORT: 3200
      DATABASE_URL: postgres://apuflow:${BD_CLAVE}@127.0.0.1:5432/apuflow
      LICENCIA_OBLIGATORIA: ${LICENCIA_OBLIGATORIA:-0}
